spring.application.name=ms-andesstay-bff
server.port=8080

spring.config.import=optional:file:.env[.properties]

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://cognito-idp.${AWS_REGION}.amazonaws.com/${COGNITO_USER_POOL_ID}

reservas.service.url=${RESERVAS_SERVICE_URL:http://localhost:8082}
usuarios.service.url=${USUARIOS_SERVICE_URL:http://localhost:8081}
rabbitadmin.service.url=${RABBIT_ADMIN_SERVICE_URL:http://localhost:8090}

# Topologia RabbitMQ
hotel.messaging.dlx=hotel.dlx
hotel.messaging.exchanges.eventos=hotel.eventos
hotel.messaging.exchanges.documentos=hotel.documentos
hotel.messaging.queues.notificaciones=q.notificaciones
hotel.messaging.queues.tickets=q.tickets
hotel.messaging.queues.documentos=q.documentos
hotel.messaging.routing.notificaciones[0]=usuario.registrado
hotel.messaging.routing.notificaciones[1]=reserva.#
hotel.messaging.routing.tickets[0]=reserva.creada
hotel.messaging.routing.documentos[0]=comprobante

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# Retencion y limpieza de las colas principales
hotel.messaging.retencion.max-length=10000
hotel.messaging.retencion.ttl-ms=86400000

# Nombres de las DLQ que consume DlqConsumer
hotel.messaging.dlq.notificaciones=q.notificaciones.dlq
hotel.messaging.dlq.tickets=q.tickets.dlq
hotel.messaging.dlq.documentos=q.documentos.dlq

# Confirmacion manual y reintentos acotados
spring.rabbitmq.listener.simple.acknowledge-mode=manual
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000ms
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=5000ms